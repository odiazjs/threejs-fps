services:
  - type: web
    name: threejs-fps-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm install --prefix ..
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MIGRATE_ON_START
        value: "true"
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: threejs-fps-client
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: threejs-fps-client
    runtime: static
    buildCommand: npm install && npm run build:client
    staticPublishPath: dist
    envVars:
      - key: VITE_COLYSEUS_URL
        fromService:
          type: web
          name: threejs-fps-server
          envVarKey: RENDER_EXTERNAL_URL
