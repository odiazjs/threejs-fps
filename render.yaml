services:
  - type: web
    name: threejs-fps-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free

staticSites:
  - name: threejs-fps-client
    buildCommand: npm install && npm run build:client
    staticPublishPath: dist
    envVars:
      - key: VITE_COLYSEUS_URL
        fromService:
          type: web
          name: threejs-fps-server
          envVarKey: RENDER_EXTERNAL_URL
