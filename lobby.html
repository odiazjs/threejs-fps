<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js FPS — Lobby</title>
    <style>
      html {
        background: #0e1114;
        color-scheme: dark;
      }

      body:not(.app-ready) .app-view {
        visibility: hidden;
      }

      #page-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10001;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e1114;
      }

      #page-boot-splash .page-boot-spinner {
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 50%;
        border: 3px solid rgba(130, 219, 219, 0.2);
        border-top-color: #82dbdb;
        animation: page-boot-spin 0.75s linear infinite;
      }

      @keyframes page-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <link rel="stylesheet" href="/src/styles/pages.css" />
  </head>
  <body class="lobby-page app-shell">
    <div id="page-boot-splash" aria-live="polite" aria-busy="true">
      <div class="page-boot-spinner" aria-hidden="true"></div>
    </div>

    <section id="app-view-lobby" class="app-view" data-view="lobby">
      <div id="lobby-canvas"></div>
      <div class="lobby-ui">
        <div class="lobby-top-bar">
          <div class="lobby-account-bar">
            <div class="lobby-account panel">
              <div class="lobby-account-body">
                <div class="lobby-account-details">
                  <div class="lobby-account-label">SIGNED IN</div>
                  <div class="lobby-username" id="lobby-username">Player</div>
                  <div class="lobby-email" id="lobby-email">player@example.com</div>
                </div>
                <button
                  id="lobby-logout-btn"
                  class="lobby-logout-btn"
                  type="button"
                  title="Log out"
                  aria-label="Log out"
                >
                  <svg class="lobby-logout-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                    <polyline
                      points="16 17 21 12 16 7"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                    <line
                      x1="21"
                      y1="12"
                      x2="9"
                      y2="12"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="lobby-stats">
            <div class="lobby-stat">
              <span class="lobby-stat-label">KILLS</span>
              <span class="lobby-stat-value" id="stat-kills">0</span>
            </div>
            <div class="lobby-stat">
              <span class="lobby-stat-label">K/D</span>
              <span class="lobby-stat-value" id="stat-kd">0.00</span>
            </div>
          </div>
        </div>

        <aside id="friends-panel" class="friends-panel panel">
          <h2 class="friends-title">FRIENDS</h2>
          <div class="friends-add-row">
            <input
              id="friend-email-input"
              class="text-input"
              type="email"
              placeholder="Friend email"
              autocomplete="email"
            />
            <button id="friend-add-btn" class="primary-btn" type="button">ADD</button>
          </div>
          <div id="friends-status" class="friends-status"></div>
          <label id="friendly-fire-toggle" class="friendly-fire-toggle" hidden>
            <input id="friendly-fire-checkbox" type="checkbox" />
            <span>Friendly fire</span>
          </label>
          <button id="game-start-btn" class="primary-btn game-start-btn" type="button" hidden>
            START GAME
          </button>
          <button id="party-leave-btn" class="secondary-btn party-leave-btn" type="button" hidden>
            LEAVE PARTY
          </button>
        <ul id="friends-list" class="friends-list"></ul>
      </aside>

      <nav id="lobby-menu" aria-label="Lobby menu">
          <button
            id="lobby-leaderboard-btn"
            class="lobby-menu-item secondary-btn"
            type="button"
          >
            LEADERBOARD
          </button>
          <button id="lobby-weapons-btn" class="lobby-menu-item secondary-btn" type="button">
            WEAPONS
          </button>
          <button id="lobby-settings-btn" class="lobby-menu-item secondary-btn" type="button">
            SETTINGS
          </button>
        </nav>

        <button id="lobby-join-btn" class="primary-btn" type="button">QUICK MATCH</button>
      </div>
    </section>

    <div id="friend-toasts" class="friend-toasts"></div>

    <section id="app-view-weapons" class="app-view" data-view="weapons" hidden>
      <div id="weapons-canvas"></div>
      <div class="weapons-ui">
        <nav id="weapons-picker" class="weapons-picker panel" aria-label="Weapon selection">
          <button
            type="button"
            class="weapons-picker-btn active"
            data-weapon-id="pistol"
          >
            Pistol
          </button>
          <button
            type="button"
            class="weapons-picker-btn"
            data-weapon-id="plasma_rifle"
          >
            Assault Rifle
          </button>
          <button
            type="button"
            class="weapons-picker-btn"
            data-weapon-id="sniper_rifle"
          >
            Sniper Rifle
          </button>
          <button
            type="button"
            class="weapons-picker-btn"
            data-weapon-id="katana"
          >
            Katana
          </button>
        </nav>
        <button id="weapons-back-btn" class="secondary-btn weapons-back-btn" type="button">
          BACK TO LOBBY
        </button>
      </div>
    </section>

    <section id="app-view-leaderboard" class="app-view" data-view="leaderboard" hidden>
      <main class="leaderboard-shell panel">
        <h1 class="leaderboard-title">LEADERBOARD</h1>
        <p id="leaderboard-status" class="leaderboard-status">Loading...</p>
        <div class="leaderboard-table-wrap">
          <table class="leaderboard-table" aria-label="Global player rankings">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Player</th>
                <th scope="col">Email</th>
                <th scope="col">Kills</th>
                <th scope="col">K/D</th>
              </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
          </table>
        </div>
      </main>
      <button id="leaderboard-back-btn" class="secondary-btn leaderboard-back-btn" type="button">
        BACK TO LOBBY
      </button>
    </section>

    <section id="app-view-settings" class="app-view" data-view="settings" hidden>
      <main class="settings-shell panel">
        <h1 class="settings-title">SETTINGS</h1>
        <div class="settings-option">
          <div class="settings-option-header">
            <label for="lobby-music-volume" class="settings-label">Lobby music volume</label>
            <span id="lobby-music-volume-value" class="settings-value">14%</span>
          </div>
          <input
            id="lobby-music-volume"
            class="settings-slider"
            type="range"
            min="0"
            max="100"
            step="1"
            value="14"
          />
        </div>
      </main>
      <button id="settings-back-btn" class="secondary-btn settings-back-btn" type="button">
        BACK TO LOBBY
      </button>
    </section>

    <script type="module" src="/src/lobby/main.ts"></script>
  </body>
</html>
