<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js FPS — Sign In</title>
  </head>
  <body class="auth-page" hidden>
    <div class="auth-panel panel">
      <h1>Three.js FPS</h1>
      <p>Choose a username to play. Your session is saved in this browser.</p>
      <form id="auth-form">
        <input
          id="auth-username"
          class="text-input"
          type="text"
          placeholder="Username"
          maxlength="16"
          autocomplete="username"
          required
        />
        <button id="auth-submit" class="primary-btn" type="submit">CONTINUE</button>
        <div id="auth-error" class="error-text"></div>
      </form>
    </div>
    <script type="module" src="/src/auth/main.ts"></script>
  </body>
</html>
