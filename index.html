<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js FPS</title>
    <style>
      * { margin: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
      #blocker {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        cursor: pointer; z-index: 10;
      }
      #instructions {
        color: #fff; text-align: center; pointer-events: none;
      }
      #instructions h1 { font-size: 2rem; margin-bottom: 0.5rem; }
      #instructions p { opacity: 0.8; }
      #crosshair {
        position: fixed; top: 50%; left: 50%;
        width: 4px; height: 4px;
        margin: -2px 0 0 -2px;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        pointer-events: none; z-index: 5;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="blocker">
      <div id="instructions">
        <h1>Click to play</h1>
        <p>WASD to move · Mouse to look · Esc to unlock</p>
      </div>
    </div>
    <div id="crosshair"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
