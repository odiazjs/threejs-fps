<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js FPS — Sign In</title>
    <style>
      html {
        background: #04080e;
        color-scheme: dark;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/pages.css" />
  </head>
  <body class="auth-page" hidden>
    <div class="auth-panel panel hud-panel hud-brackets">
      <h1>Three.js FPS</h1>
      <p class="auth-subtitle">Sign in or create an account to play.</p>

      <div class="auth-tabs" role="tablist">
        <button id="auth-tab-login" class="auth-tab active" type="button" role="tab">
          Sign In
        </button>
        <button id="auth-tab-signup" class="auth-tab" type="button" role="tab">
          Sign Up
        </button>
      </div>

      <form id="login-form" class="auth-form">
        <input
          id="login-email"
          class="text-input"
          type="email"
          placeholder="Email"
          autocomplete="email"
          required
        />
        <input
          id="login-password"
          class="text-input"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
        <button id="login-submit" class="primary-btn" type="submit">SIGN IN</button>
        <div id="login-error" class="error-text"></div>
      </form>

      <form id="signup-form" class="auth-form" hidden>
        <input
          id="signup-email"
          class="text-input"
          type="email"
          placeholder="Email"
          autocomplete="email"
          required
        />
        <input
          id="signup-password"
          class="text-input"
          type="password"
          placeholder="Password"
          autocomplete="new-password"
          minlength="8"
          required
        />
        <p id="signup-policy-hint" class="auth-policy-hint"></p>
        <input
          id="signup-confirm-password"
          class="text-input"
          type="password"
          placeholder="Confirm password"
          autocomplete="new-password"
          minlength="8"
          required
        />
        <button id="signup-submit" class="primary-btn" type="submit">CREATE ACCOUNT</button>
        <div id="signup-error" class="error-text"></div>
      </form>
    </div>
    <script type="module" src="/src/auth/main.ts"></script>
  </body>
</html>
